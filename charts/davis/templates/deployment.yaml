{{- $fullName := include "davis.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "davis.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "davis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "davis.labels" . | nindent 8 }}
	{{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "davis.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          env:
            - name: APP_ENV
              value: {{ .Values.davis.appEnv }}
            - name: CALDAV_ENABLED
              value: '{{ .Values.davis.features.calDav }}'
            - name: CARDDAV_ENABLED
              value: '{{ .Values.davis.features.cardDav }}'
            - name: WEBDAV_ENABLED
              value: '{{ .Values.davis.features.webDav }}'
            - name: PUBLIC_CALENDARS_ENABLED
              value: '{{ .Values.davis.features.publicCalendars }}'
            - name: BIRTHDAY_REMINDER_OFFSET
              value: {{ .Values.davis.birthdayReminderOffset }}
            - name: APP_TIMEZONE
              value: {{ .Values.davis.timezone }}
            - name: ADMIN_LOGIN
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: ADMIN_LOGIN
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: ADMIN_PASSWORD
            - name: DATABASE_DRIVER
              value: {{ .Values.davis.database.driver }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}
                  key: DATABASE_URL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
