{{- $fullName := include "davis.fullname" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
type: Opaque
data:
  ADMIN_LOGIN: {{ .Values.davis.admin.username | b64enc }}
  ADMIN_PASSWORD: {{ .Values.davis.admin.password | b64enc }}
  DATABASE_URL: {{ .Values.davis.database.url | b64enc }}
